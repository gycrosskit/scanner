name: Component regression
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release tag to verify (empty runs source regression)
        type: string
        required: false
permissions:
  contents: read
# JVM 启动前设置；Gradle init 时 DNS 策略可能已初始化，不能在那时才改。
env:
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security
concurrency:
  group: regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  contracts:
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.version == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: npm install --prefix "$RUNNER_TEMP/ci-tools" --ignore-scripts --no-audit --no-fund typescript@4.9.5
      - run: |
          python3 scripts/test-check-maven.py
          python3 scripts/test-jitpack-metadata.py
          TYPESCRIPT_PATH="$RUNNER_TEMP/ci-tools/node_modules/typescript" node --test tests/scanner.cjs tests/scanner-preview.cjs
  android:
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.version == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - run: bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :scanner-core:testDebugUnitTest :scanner-core:compileDebugKotlinAndroid :scanner-kuikly:compileDebugKotlinAndroid --no-daemon --max-workers=1
      - run: |
          bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-kuikly test --refresh-dependencies --info --no-daemon --max-workers=1
  native:
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.version == '')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: |
          case "$(uname -m)" in
            arm64) native_target=IosSimulatorArm64; native_test=iosSimulatorArm64Test ;;
            x86_64) native_target=IosX64; native_test=iosX64Test ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :scanner-core:compileKotlinIosArm64 :scanner-core:compileKotlin${native_target} :scanner-core:compileKotlinOhosArm64 :scanner-kuikly:compileKotlinIosArm64 :scanner-kuikly:compileKotlin${native_target} :scanner-kuikly:compileKotlinOhosArm64 --no-daemon --max-workers=1
      - run: xcrun swiftc -typecheck -target "$(uname -m)-apple-ios15.0-simulator" -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" iosApp/Sources/GycScannerNative/*.swift
  release-android:
    if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version || '0.1.6' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - run: bash scripts/ci-release.sh
      - run: |
          unified_ui=true
          case "$VERSION" in 0.1.2|0.1.3|0.1.4|0.1.5) unified_ui=false ;; esac
          bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification compileDebugKotlinAndroid -PscannerVersion="$VERSION" -PverifyUnifiedUi="$unified_ui" --refresh-dependencies --no-daemon --max-workers=1
  release-native:
    if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version || '0.1.6' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-release.sh
      - run: |
          case "$(uname -m)" in
            arm64) native_target=IosSimulatorArm64; native_test=iosSimulatorArm64Test ;;
            x86_64) native_target=IosX64; native_test=iosX64Test ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          unified_ui=true
          case "$VERSION" in 0.1.2|0.1.3|0.1.4|0.1.5) unified_ui=false ;; esac
          render_args=()
          if [[ "$unified_ui" == true ]]; then
            render_dir=$(bash scripts/ci-build-kuikly-render.sh "$RUNNER_TEMP/kuikly-ios-render")
            render_args=("-PkuiklyRenderFrameworkDir=$render_dir")
          fi
          bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification linkDebugFramework${native_target} compileKotlinOhosArm64 -PscannerVersion="$VERSION" -PverifyUnifiedUi="$unified_ui" "${render_args[@]}" --refresh-dependencies --no-daemon --max-workers=1
